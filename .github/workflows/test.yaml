name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  attestations: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@6f3b25f2091c648162dbd0b9b5fff0d79b7fb364 # v0.10.3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.10.3
          tools: >-
            cataggar/zig@v0.17.1
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify Zig version
        shell: bash
        run: |
          version="$(zig version)"
          echo "Zig version: $version"
          test "$version" = "0.17.1"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                 dbus gnome-keyring; then
              exit 0
            fi
            echo "apt-get attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          exit 1

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            zig build --verbose --summary all test
            zig build --verbose --summary all test -Dfile-backend=true
            zig build --verbose --summary all test-secret-service -Dsecret-service-transport=dh
            KEYRING_TEST_TRANSPORT=dh zig build --verbose --summary all test
          '

      - name: Run tests
        if: runner.os != 'Linux'
        run: |
          zig build --verbose --summary all test
          zig build --verbose --summary all test -Dfile-backend=true

  secret-service-transports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [auto, plain, dh]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@6f3b25f2091c648162dbd0b9b5fff0d79b7fb364 # v0.10.3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.10.3
          tools: >-
            cataggar/zig@v0.17.1
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify Zig version
        shell: bash
        run: |
          version="$(zig version)"
          echo "Zig version: $version"
          test "$version" = "0.17.1"

      - name: Install Linux dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                 dbus gnome-keyring; then
              exit 0
            fi
            echo "apt-get attempt ${attempt} failed; retrying..." >&2
            sleep 5
          done
          exit 1

      - name: Run Secret Service transport coverage
        shell: bash
        run: |
          dbus-run-session -- bash -lc '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            zig build --verbose --summary all test-secret-service -Dsecret-service-transport=${{ matrix.transport }}
            zig build --verbose --summary all test -Dsecret-service-transport=${{ matrix.transport }}
          '
